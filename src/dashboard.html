<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex 恢复控制台</title>
<style>:root{color-scheme:light}body{font:15px system-ui;background:#f3f5f7;color:#17252d;max-width:1000px;margin:32px auto;padding:0 20px}header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}article{background:white;border:1px solid #dce2e6;border-radius:12px;padding:22px;margin:18px 0}h1{font-size:26px}h2{font-size:17px;word-break:break-all}p{word-break:break-all}textarea{display:block;box-sizing:border-box;width:100%;min-height:100px;margin:10px 0;padding:12px;border:1px solid #bdc9ce;border-radius:6px;font:inherit}button,select{font:inherit;padding:8px 12px;border:1px solid #bdc9ce;border-radius:6px;margin:4px;background:white}button,select,select option,textarea{color:#17252d}select,select option{background-color:#fff;color-scheme:light}button{cursor:pointer}button.primary{background:#126758;color:white}small{color:#56707a}.badge{color:#126758;font-weight:600}#error{color:#a22;white-space:pre-wrap}</style>
<header><h1>Codex 恢复控制台</h1><span><select id="filter" aria-label="任务显示范围"><option value="pending">待恢复 / 需处理</option><option value="all">全部任务</option></select><button id="refresh">刷新状态</button></span></header><p>选择额度恢复后的处理方式。恢复 prompt 可以留空，默认继续原任务；自填内容会作为追加指令在下一次恢复时使用。</p><small>每 3 秒刷新状态；输入内容不会被刷新覆盖。关闭本页面不影响守候。只支持当前电脑的本地任务。</small><p id="error"></p><main id="jobs"></main>
<script>
const token=location.hash.slice(1), cards=new Map();
const labels={watching:'工作中 / 守候',waiting_quota:'等待额度重置',waiting_thread:'等待原客户端释放聊天',running:'恢复轮次执行中',complete:'已完成',cancelled:'已撤销',blocked:'需人工处理',pending:'准备恢复',waiting_dsh:'等待 DSH',dsh_action:'处理 DSH 动作'};
let requestId=0;const pending=new Map();let interval;
function rpc(method,params){return new Promise((resolve,reject)=>{const id=++requestId;const timer=setTimeout(()=>{pending.delete(id);reject(Error('桌面插件通信超时，请确认客户端支持 MCP Apps。'))},15000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.method==='ui/resource-teardown'){clearInterval(interval);window.parent.postMessage({jsonrpc:'2.0',id:m.id,result:{}},'*');return}const p=pending.get(m.id);if(!p)return;pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(Error(m.error.message)):p.resolve(m.result)});
const embedded=!token&&window.parent!==window;
const ready=embedded?rpc('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'codex-auto-resume',version:'0.3.0'},appCapabilities:{}}).then(()=>{window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*')}):Promise.resolve();
async function api(path,body){if(embedded){await ready;const name=path==='/api/control'?'set_resume_control':'list_resume_jobs';const result=await rpc('tools/call',{name,arguments:body||{}});if(result.isError)throw Error(result.content?.[0]?.text||'插件操作失败');return result.structuredContent||(result.jobs||result.control?result:null)||JSON.parse(result.content?.find(x=>x.type==='text')?.text||'{}')}const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d}
function add(job){const card=document.createElement('article');const title=document.createElement('h2'),status=document.createElement('p'),details=document.createElement('p'),mode=document.createElement('select'),prompt=document.createElement('textarea'),save=document.createElement('button'),approve=document.createElement('button'),feedback=document.createElement('small');status.className='badge';
for(const [v,t]of [['auto','额度恢复后自动继续'],['confirm','先等待我的确认'],['off','停用自动恢复']]){const o=document.createElement('option');o.value=v;o.textContent=t;mode.append(o)}mode.value=job.control?.mode||'auto';prompt.value=job.control?.prompt||'';prompt.placeholder='可不填：默认继续原任务。也可填写恢复时追加的指令。';prompt.maxLength=20000;save.textContent='保存设置与指令';approve.textContent='确认下一次恢复';approve.className='primary';
async function update(approveNow){try{await api('/api/control',{session:job.session,turn:job.turn,mode:approveNow?'confirm':mode.value,prompt:prompt.value,approve:approveNow});if(approveNow)mode.value='confirm';feedback.textContent=approveNow?' 已确认下一次提交；仍会等待可用额度。':' 已保存；尚未提交的轮次将采用此设置。';await refresh()}catch(e){feedback.textContent=e.message}}
save.onclick=()=>update(false);approve.onclick=()=>update(true);card.append(title,status,details,mode,prompt,save,approve,feedback);document.querySelector('#jobs').append(card);return{card,title,status,details,mode,prompt,save,approve}}
async function refresh(){try{if(!token&&!embedded)throw Error('请使用安装器给出的完整面板链接（包含 # 后的访问凭据）。');const data=await api('/api/jobs');const showAll=document.querySelector('#filter').value==='all';const visible=new Set();for(const j of data.jobs){const key=j.session+'/'+j.turn;let c=cards.get(key);if(!c){c=add(j);cards.set(key,c)}const show=showAll||['waiting_quota','waiting_thread','pending','blocked','error'].includes(j.status);c.card.hidden=!show;if(show)visible.add(key);c.title.textContent=j.title||j.cwd||j.session;c.status.textContent=(labels[j.status]||j.status)+(j.runner_alive?' · 守候进程在线':' · 无活动守候进程');c.details.textContent=key+' · '+(j.summary||'')+(j.control?.prompt_file?' · CLI prompt 文件：'+j.control.prompt_file:'')+(j.retry_at?' · 下次恢复检查 '+new Date(j.retry_at*1000).toLocaleString():'')+(j.control?.mode==='off'?' · 自动恢复已停用':j.control?.mode==='confirm'&&(!j.control.approved||j.control.revision===j.applied_control_id)?' · 下一次提交待确认':'');const ended=['complete','cancelled','blocked','error'].includes(j.status);for(const el of[c.mode,c.prompt,c.save,c.approve])el.disabled=ended}for(const [key,c]of cards)if(!data.jobs.some(j=>j.session+'/'+j.turn===key))c.card.hidden=true;document.querySelector('#error').textContent=visible.size?'':showAll?'暂无已登记的本地任务。启动新的 Codex 任务后会在这里显示。':'暂无待恢复任务；已登记的工作仍由后台守候，可切换“全部任务”查看。'}catch(e){document.querySelector('#error').textContent=e.message}}
document.querySelector('#filter').onchange=refresh;document.querySelector('#refresh').onclick=refresh;refresh();interval=setInterval(refresh,3000);
if(embedded)new ResizeObserver(()=>window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height:document.documentElement.scrollHeight,width:document.documentElement.scrollWidth}},'*')).observe(document.body);
</script></html>
