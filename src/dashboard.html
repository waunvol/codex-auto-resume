<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex 恢复控制台</title>
<style>:root{color-scheme:light}body{font:15px system-ui;background:#f3f5f7;color:#17252d;max-width:1000px;margin:32px auto;padding:0 20px}header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}article{background:white;border:1px solid #dce2e6;border-radius:12px;padding:22px;margin:18px 0}h1{font-size:26px}h2{font-size:17px;word-break:break-all}p{word-break:break-all}textarea{display:block;box-sizing:border-box;width:100%;min-height:100px;margin:10px 0;padding:12px;border:1px solid #bdc9ce;border-radius:6px;font:inherit}button,select{font:inherit;padding:8px 12px;border:1px solid #bdc9ce;border-radius:6px;margin:4px;background:white}button,select,select option,textarea{color:#17252d}select,select option{background-color:#fff;color-scheme:light}button{cursor:pointer}button.primary{background:#126758;color:white}small{color:#56707a}.badge{color:#126758;font-weight:600}#error{color:#a22;white-space:pre-wrap}</style>
<style>#network label{display:block;margin:12px 0}#proxy-url{display:block;box-sizing:border-box;width:100%;margin:8px 0;padding:10px;border:1px solid #bdc9ce;border-radius:6px;background:#fff;color:#17252d;font:inherit;color-scheme:light}#proxy-mode{max-width:100%}#proxy-feedback{display:block;white-space:pre-wrap}.unlock-option{display:flex;align-items:flex-start;gap:8px;margin:12px 0;color:#17252d}.unlock-option input{accent-color:#126758;margin-top:4px}</style>
<header><h1>Codex 恢复控制台</h1><span><select id="filter" aria-label="任务显示范围"><option value="pending">待恢复 / 需处理</option><option value="all">全部任务</option></select><button id="refresh">刷新状态</button></span></header><p>选择额度恢复后的处理方式。恢复 prompt 可以留空，默认继续原任务；自填内容会作为追加指令在下一次恢复时使用。</p><small>每 3 秒刷新状态；输入内容不会被刷新覆盖。关闭本页面不影响守候。只支持当前电脑的本地任务。</small>
<article id="network" hidden><h2>连接与代理设置</h2><p>用于本机所有恢复任务，下次连接 Codex 时生效，不中断正在执行的任务。</p><label>连接方式 <select id="proxy-mode"><option value="custom">指定代理地址</option><option value="inherit">继承启动环境</option><option value="direct">直连（禁用环境代理）</option></select></label><label id="proxy-url-label">代理地址（含端口）<input id="proxy-url" type="url" placeholder="http://127.0.0.1:7890" autocomplete="off" spellcheck="false"></label><p id="proxy-current"></p><button id="proxy-save" class="primary">保存代理设置</button><small id="proxy-feedback" role="status"></small></article>
<p id="error"></p><main id="jobs"></main>
<script>
const token=location.hash.slice(1), cards=new Map();
const labels={watching:'工作中 / 守候',waiting_quota:'等待额度重置',waiting_thread:'等待原客户端释放聊天',running:'恢复轮次执行中',complete:'本轮已结束',cancelled:'已撤销',blocked:'需人工处理',pending:'准备恢复',waiting_dsh:'等待 DSH',dsh_action:'处理 DSH 动作'};
let requestId=0;const pending=new Map();let interval;
function rpc(method,params){return new Promise((resolve,reject)=>{const id=++requestId;const timer=setTimeout(()=>{pending.delete(id);reject(Error('桌面插件通信超时，请确认客户端支持 MCP Apps。'))},15000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.method==='ui/resource-teardown'){clearInterval(interval);window.parent.postMessage({jsonrpc:'2.0',id:m.id,result:{}},'*');return}const p=pending.get(m.id);if(!p)return;pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(Error(m.error.message)):p.resolve(m.result)});
const embedded=!token&&window.parent!==window;
const ready=embedded?rpc('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'codex-auto-resume',version:'0.4.0'},appCapabilities:{}}).then(()=>{window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*')}):Promise.resolve();
async function api(path,body){if(embedded){await ready;const name={'/api/control':'set_resume_control','/api/proxy':'set_resume_proxy','/api/jobs':'list_resume_jobs'}[path];if(!name)throw Error('未知面板操作');const result=await rpc('tools/call',{name,arguments:body||{}});if(result.isError)throw Error(result.content?.[0]?.text||'插件操作失败');return result.structuredContent||(result.jobs||result.control||result.network?result:null)||JSON.parse(result.content?.find(x=>x.type==='text')?.text||'{}')}const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d}
let networkInitialized=false,desktopUnlockSupported=false;
function proxyFields(){const custom=document.querySelector('#proxy-mode').value==='custom';document.querySelector('#proxy-url-label').hidden=!custom;document.querySelector('#proxy-url').disabled=!custom}
function renderNetwork(network){
 if(!embedded||!network)return;
 document.querySelector('#network').hidden=false;
 if(network.error){document.querySelector('#proxy-current').textContent='配置读取失败：'+network.error;return}
 const value=network.proxy;
 if(!networkInitialized){const custom=!['inherit','direct'].includes(value);document.querySelector('#proxy-mode').value=custom?'custom':value;document.querySelector('#proxy-url').value=custom?value:'';proxyFields();networkInitialized=true}
 document.querySelector('#proxy-current').textContent='已保存：'+(value==='inherit'?'继承启动环境':value==='direct'?'直连':value)+(network.environment_override?'。CODEX_RESUME_PROXY 环境变量正在覆盖此设置。':'');
}
async function saveProxy(){
 const mode=document.querySelector('#proxy-mode'),url=document.querySelector('#proxy-url'),save=document.querySelector('#proxy-save'),feedback=document.querySelector('#proxy-feedback');
 const value=mode.value==='custom'?url.value.trim():mode.value;
 if(!value){feedback.textContent='请填写代理地址及端口。';return}
 mode.disabled=url.disabled=save.disabled=true;
 try{const data=await api('/api/proxy',{proxy:value});networkInitialized=false;renderNetwork(data.network);feedback.textContent='已保存，下次连接时生效；不会中断正在执行的任务。'}catch(error){feedback.textContent=error.message}
 finally{mode.disabled=save.disabled=false;proxyFields()}
}
document.querySelector('#proxy-mode').onchange=proxyFields;
document.querySelector('#proxy-save').onclick=saveProxy;
function add(job){const card=document.createElement('article');const title=document.createElement('h2'),status=document.createElement('p'),details=document.createElement('p'),mode=document.createElement('select'),prompt=document.createElement('textarea'),save=document.createElement('button'),approve=document.createElement('button'),release=document.createElement('button'),unlock=document.createElement('input'),unlockLabel=document.createElement('label'),unlockText=document.createElement('span'),feedback=document.createElement('small');status.className='badge';
for(const [v,t]of [['auto','额度恢复后自动继续'],['confirm','先等待我的确认'],['off','停用自动恢复']]){const o=document.createElement('option');o.value=v;o.textContent=t;mode.append(o)}mode.value=job.control?.mode||'auto';prompt.value=job.control?.prompt||'';prompt.placeholder='可不填：默认继续原任务。也可填写恢复时追加的指令。';prompt.maxLength=20000;save.textContent='保存设置与指令';approve.textContent='确认下一次恢复';approve.className='primary';release.textContent='释放聊天锁';release.title='授权执行器在下次检查时释放闲置聊天的写锁';unlock.type='checkbox';unlock.checked=job.control?.desktop_unlock===true;unlockLabel.className='unlock-option';unlockText.textContent='允许临时归档并还原原聊天，自动释放桌面写锁（保持原聊天 ID 和历史）';unlockLabel.append(unlock,unlockText);
async function update(approveNow,unlockNow=false){if(unlockNow){if(mode.value==='off'){feedback.textContent='请先启用恢复模式。';return}unlock.checked=true}try{const result=await api('/api/control',{session:job.session,turn:job.turn,mode:approveNow?'confirm':mode.value,prompt:prompt.value,approve:approveNow,...(desktopUnlockSupported?{desktop_unlock:unlock.checked}:{})});if(desktopUnlockSupported&&unlock.checked&&result.control?.desktop_unlock!==true)throw Error('当前连接尚未加载新版解锁接口，请重新加载插件后再保存。');if(approveNow)mode.value='confirm';feedback.textContent=unlockNow?' 已授权临时归档并还原；执行器会在下次检查时处理。确认模式仍需确认下一次恢复。':approveNow?' 已确认下一次提交；仍会等待可用额度。':' 已保存；尚未提交的轮次将采用此设置。';await refresh()}catch(e){feedback.textContent=e.message}}
save.onclick=()=>update(false);approve.onclick=()=>update(true);release.onclick=()=>update(false,true);card.append(title,status,details,mode,prompt,unlockLabel,save,approve,release,feedback);document.querySelector('#jobs').append(card);return{card,title,status,details,mode,prompt,save,approve,unlock,release}}
async function refresh(){try{if(!token&&!embedded)throw Error('请使用安装器给出的完整面板链接（包含 # 后的访问凭据）。');const data=await api('/api/jobs');desktopUnlockSupported=embedded&&data.capabilities?.desktop_unlock===true;renderNetwork(data.network);const showAll=document.querySelector('#filter').value==='all';const visible=new Set();for(const j of data.jobs){const key=j.session+'/'+j.turn;let c=cards.get(key);if(!c){c=add(j);cards.set(key,c)}const show=showAll||(j.is_latest!==false&&['waiting_quota','waiting_thread','pending','blocked','error'].includes(j.status));c.card.hidden=!show;if(show)visible.add(key);c.title.textContent=j.title||j.cwd||j.session;c.status.textContent=(j.is_latest===false?'历史轮次 · ':'')+(labels[j.status]||j.status)+(j.runner_alive?' · 守候进程在线':' · 无活动守候进程');c.details.textContent=key+' · '+(j.summary||'')+(j.control?.prompt_file?' · CLI prompt 文件：'+j.control.prompt_file:'')+(j.retry_at?' · 下次恢复检查 '+new Date(j.retry_at*1000).toLocaleString():'')+(j.control?.mode==='off'?' · 自动恢复已停用':j.control?.mode==='confirm'&&(!j.control.approved||j.control.revision===j.applied_control_id)?' · 下一次提交待确认':'');const ended=['complete','cancelled','blocked','error'].includes(j.status);for(const el of[c.mode,c.prompt,c.save,c.approve,c.unlock])el.disabled=ended;c.unlock.disabled=ended||!desktopUnlockSupported;c.unlock.title=desktopUnlockSupported?'':'当前连接尚未加载新版解锁接口';c.release.disabled=ended||j.status!=='waiting_thread'||!j.runner_alive||!desktopUnlockSupported;c.release.title=desktopUnlockSupported?'执行器将在下次检查时处理':'当前连接尚未加载新版解锁接口'}for(const [key,c]of cards)if(!data.jobs.some(j=>j.session+'/'+j.turn===key))c.card.hidden=true;document.querySelector('#error').textContent=visible.size?'':showAll?'暂无已登记的本地任务。启动新的 Codex 任务后会在这里显示。':'暂无待恢复任务；切换“全部任务”可查看工作中、已结束及历史轮次。'}catch(e){document.querySelector('#error').textContent=e.message}}
document.querySelector('#filter').onchange=refresh;document.querySelector('#refresh').onclick=refresh;refresh();interval=setInterval(refresh,3000);
if(embedded)new ResizeObserver(()=>window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height:document.documentElement.scrollHeight,width:document.documentElement.scrollWidth}},'*')).observe(document.body);
</script></html>
